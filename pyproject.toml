[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-svcs-integration"
version = "0.2.1"
description = "Django app for svcs"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["django", "services", "di"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


dependencies = [
    "Django>=5.2,<6.0",
    "svcs>=26.2.0",
    "typing-extensions>=4.13.0",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["django_svcs*"]

[tool.setuptools.package-data]
django_svcs = [
    "migrations/*.py",
    "static/**/*",
    "templates/**/*.html",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "django-stubs[compatible-mypy]>=6.0.7,<7.0",
    "mypy>=2.2",
    "pre-commit>=4.5.1",
    "ruff>=0.15.1",
]


[tool.mypy]
python_version = "3.12"
files = ["django_svcs", "tests/typing_check.py"]
strict = true
# Registration callbacks intentionally accept arbitrary service signatures.
disallow_any_generics = false


[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
extend-exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
# F: Pyflakes, E/W: Pycodestyle, I: isort, DJ: Django
# UP: pyupgrade, B: bugbear, SIM: simplify
select = ["F", "E", "W", "I", "DJ", "UP", "B", "SIM"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["django_svcs"]
forced-separate = ["tests"]
lines-after-imports = 2
lines-between-types = 0
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
